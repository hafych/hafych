<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Nazarii Hafych role system map</title>
  <desc id="desc">An animated map connecting science, data, AI, product, and security engineering.</desc>

  <defs>
    <linearGradient id="map-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f3f1eb"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="dot-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="p-science" d="M465 112C405 84 350 62 292 62"/>
    <path id="p-data" d="M465 130C400 146 350 181 302 185"/>
    <path id="p-ai" d="M735 112C795 82 850 62 908 62"/>
    <path id="p-product" d="M735 130C800 145 850 181 898 185"/>
  </defs>

  <rect x="12" y="12" width="1176" height="226" rx="22" fill="url(#map-bg)" stroke="#d6d3d1" stroke-width="2"/>

  <g fill="none" stroke="#a8a29e" stroke-width="2" stroke-dasharray="7 9" opacity="0.72">
    <use href="#p-science"><animate attributeName="stroke-dashoffset" values="0;-32" dur="3.2s" repeatCount="indefinite"/></use>
    <use href="#p-data"><animate attributeName="stroke-dashoffset" values="0;-32" dur="3.8s" repeatCount="indefinite"/></use>
    <use href="#p-ai"><animate attributeName="stroke-dashoffset" values="0;32" dur="3s" repeatCount="indefinite"/></use>
    <use href="#p-product"><animate attributeName="stroke-dashoffset" values="0;32" dur="3.6s" repeatCount="indefinite"/></use>
    <path d="M600 161V210" stroke="#f97316" stroke-dasharray="4 7">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <g>
      <rect x="92" y="36" width="200" height="52" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="192" y="68" font-size="17" font-weight="700" fill="#1d4ed8">SCIENCE</text>
    </g>
    <g>
      <rect x="82" y="159" width="220" height="52" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="192" y="191" font-size="17" font-weight="700" fill="#1d4ed8">DATA / ANALYSIS</text>
    </g>
    <g>
      <rect x="908" y="36" width="200" height="52" rx="12" fill="#ffffff" stroke="#fed7aa"/>
      <text x="1008" y="68" font-size="17" font-weight="700" fill="#c2410c">AI EVALUATION</text>
    </g>
    <g>
      <rect x="898" y="159" width="220" height="52" rx="12" fill="#ffffff" stroke="#fed7aa"/>
      <text x="1008" y="191" font-size="17" font-weight="700" fill="#c2410c">PRODUCT SYSTEMS</text>
    </g>
    <g>
      <rect x="465" y="83" width="270" height="80" rx="17" fill="url(#core)" stroke="#fb923c" stroke-width="2"/>
      <text x="600" y="116" font-size="14" fill="#9a3412">NAZARII / BUILDER</text>
      <text x="600" y="143" font-size="18" font-weight="700" fill="#1c1917">INSPECTABLE SYSTEMS</text>
      <animate attributeName="opacity" values="0.88;1;0.88" dur="3.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="506" y="204" width="188" height="29" rx="9" fill="#292524"/>
      <text x="600" y="224" font-size="13" fill="#fdba74">SECURITY + RELIABILITY</text>
    </g>
  </g>

  <g fill="#f97316" filter="url(#dot-glow)">
    <circle r="4"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#p-science"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.8s" repeatCount="indefinite"><mpath href="#p-data"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#p-ai"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#p-product"/></animateMotion></circle>
  </g>
</svg>
